[package]
name = "agentgc"
version = "0.1.0"
edition = "2021"
description = "Scanner for disk junk left by CLI coding agents and dev tools, with a guarded one-by-one clean"

[[bin]]
name = "agentgc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
fs4 = "=0.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "=0.38.4", default-features = false, features = ["system", "disk"] }
toml = "0.8"
trash = "=5.2.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
