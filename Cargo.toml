[package]
name = "agentgc-worktree"
version = "0.3.1"
edition = "2021"
description = "Run many AI coding agents in parallel: isolated git worktree tasks (ports, databases), a service supervisor and safe cleanup. Installs the agentgc command."
license = "MIT"
repository = "https://github.com/JohnWayneeee/agentgc"
homepage = "https://github.com/JohnWayneeee/agentgc"
readme = "README.md"
keywords = ["ai-agents", "git-worktree", "cli", "claude-code", "parallel"]
categories = ["development-tools", "command-line-utilities"]
exclude = [".github/", ".gitignore", "target/", "TODO.local.md", "docs/", "*.local.md", "README.ru.md", "CONTRIBUTING.md", "SECURITY.md"]

[[bin]]
name = "agentgc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
fs4 = "=0.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "=0.38.4", default-features = false, features = ["system", "disk"] }
toml = "0.8"
trash = "=5.2.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
