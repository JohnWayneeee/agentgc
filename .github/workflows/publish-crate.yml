name: Publish crate

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run cargo publish --dry-run only
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: CARGO_REGISTRY_TOKEN
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Check tag matches Cargo.toml version
        if: ${{ github.ref_type == 'tag' }}
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="$(grep -m1 '^version[[:space:]]*=' Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]*)".*/\1/')"
          if [ -z "$version" ]; then
            echo "::error::Could not read version from Cargo.toml"
            exit 1
          fi
          if [ "$TAG_NAME" != "v$version" ]; then
            echo "::error::Tag $TAG_NAME does not match Cargo.toml version v$version"
            exit 1
          fi
      - name: Block real publish outside a tag
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && github.ref_type != 'tag' }}
        run: |
          echo "::error::Real publish runs only from a version tag"
          exit 1
      - name: Publish (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: cargo publish --locked --dry-run
      - name: Publish
        if: ${{ github.ref_type == 'tag' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
